<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Monitor</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; margin: 0; padding: 16px; }
  h1 { font-size: 1.2rem; margin: 0 0 12px; color: #fff; }
  select { font-family: monospace; background: #222; color: #fff; border: 1px solid #555; padding: 4px; }
  #held { margin: 8px 0; padding: 8px; background: #222; font-size: 1.3rem; min-height: 1.6rem; }
  #log { white-space: pre-wrap; word-break: break-all; }
  .msg { padding: 2px 0; }
  .note-on { color: #0f0; }
  .note-off { color: #f00; }
  .cc { color: #ff0; }
  .other { color: #888; }
</style>
</head>
<body>
<h1>MIDI Monitor</h1>
<select id="portSelect"><option>— no devices —</option></select>
<button id="clear">clear</button>
<div id="held"></div>
<div id="log"></div>

<script src="midi.js"></script>
<script src="utils.js"></script>
</body>
</html>
